<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Jet Lag: The Game — NYC Hide + Seek Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link href="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css" rel="stylesheet" />
<script src="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
<style>
  :root { --panel: rgba(255,248,236,.96); --text:#2a2418; --border:#e8c878; --accent:#ffb020; }
  body.dark { --panel: rgba(20,24,32,.94); --text:#f5f0e6; --border:#ffb020; --accent:#ffc848; }
  html,body { margin:0; height:100%; font-family:-apple-system,Helvetica Neue,Helvetica,Arial,sans-serif; }
  #map { position:absolute; inset:0; }
  .panel {
    position:absolute; top:12px; z-index:2; background:var(--panel); color:var(--text);
    border:2px solid var(--border); border-radius:12px; padding:12px 14px;
    box-shadow:0 6px 24px rgba(0,0,0,.2); backdrop-filter:blur(8px);
    max-height:calc(100vh - 24px); overflow-y:auto;
  }
  #panel { left:12px; min-width:220px; max-width:260px; }
  #game-panel { right:12px; width:280px; }
  .panel h1, .panel h2 { font-size:14px; margin:0 0 2px; letter-spacing:.04em; text-transform:uppercase; }
  .panel h2 { margin-top:10px; }
  .sub { font-size:11px; opacity:.75; margin:0 0 10px; line-height:1.35; }
  .row { display:flex; align-items:center; gap:8px; font-size:13px; padding:3px 0; cursor:pointer; }
  .row input { accent-color:var(--accent); }
  .sw { width:22px; height:4px; border-radius:2px; flex:0 0 auto; }
  .seg { display:flex; gap:6px; margin:4px 0 10px; }
  .seg button {
    flex:1; font-size:12px; padding:5px 0; border:1px solid var(--border); background:transparent;
    color:var(--text); border-radius:8px; cursor:pointer;
  }
  .seg button.active { background:var(--accent); color:#1a1408; border-color:var(--accent); font-weight:600; }
  .mapboxgl-popup-content { font-size:13px; font-weight:600; padding:6px 10px; border-radius:8px; }
  hr { border:none; border-top:1px solid var(--border); margin:8px 0; }
  .game-field { display:flex; flex-direction:column; gap:4px; margin:6px 0; font-size:12px; }
  .game-field label { font-weight:600; opacity:.85; }
  .game-field input, .game-field select, .game-field textarea {
    font-size:12px; padding:6px 8px; border:1px solid var(--border); border-radius:8px;
    background:transparent; color:var(--text);
  }
  .game-row { display:flex; gap:6px; }
  .game-row input { flex:1; }
  .game-btn {
    font-size:12px; padding:6px 10px; border:1px solid var(--border); border-radius:8px;
    background:var(--accent); color:#1a1408; font-weight:600; cursor:pointer; width:100%; margin-top:4px;
  }
  .game-btn.secondary { background:transparent; color:var(--text); font-weight:500; }
  .game-hint { font-size:11px; opacity:.8; margin:6px 0 0; line-height:1.35; }
  .game-item { border:1px solid var(--border); border-radius:8px; padding:8px; margin:6px 0; font-size:11px; }
  .game-item-head { display:flex; align-items:center; gap:6px; margin-bottom:4px; }
  .game-dot { width:10px; height:10px; border-radius:50%; flex:0 0 auto; }
  .game-rm { margin-left:auto; border:none; background:transparent; color:var(--text); cursor:pointer; font-size:16px; line-height:1; }
  .game-status { margin-top:4px; font-weight:600; color:var(--accent); }
  .game-item-body { opacity:.85; }

  .map-switch {
    position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:4; display:flex;
    background:var(--panel); border:2px solid var(--border); border-radius:10px; overflow:hidden;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
  }
  .map-switch a {
    padding:9px 12px; font-size:12px; font-weight:700; text-decoration:none; color:var(--text);
  }
  .map-switch a.current { background:#003DA5; color:#fff; }
  body.dark .map-switch a.current { background:var(--accent); color:#1a1408; }
</style>
</head>
<body>
<div id="map"></div>
<nav class="map-switch" aria-label="Map mode">
  <a href="index.html" class="current">Transit</a>
  <a href="citibike.html">Citi Bike</a>
</nav>

<div id="panel" class="panel">
  <h1>Jet Lag: The Game</h1>
  <p class="sub">NYC Hide + Seek · Playable transit · 0.375 mi hide zones</p>
  <div class="seg" id="theme">
    <button data-style="light" class="active">Light</button>
    <button data-style="dark">Dark</button>
  </div>
  <div id="toggles"></div>
</div>
<div id="game-panel" class="panel">
  <h2>Game Tools</h2>
  <p class="sub">Radius &amp; thermometer questions · right-click map to copy coords</p>
  <div class="game-field">
    <label>Hider coordinates</label>
    <textarea id="game-coord-paste" rows="2" placeholder="Paste lat, lng  or  lng, lat"></textarea>
    <div class="game-row">
      <input id="game-lat" type="number" step="any" placeholder="Latitude" />
      <input id="game-lng" type="number" step="any" placeholder="Longitude" />
    </div>
    <button type="button" class="game-btn" id="game-set-hider">Set hider position</button>
    <button type="button" class="game-btn secondary" id="game-clear-hider">Clear hider</button>
  </div>
  <hr />
  <div class="game-field">
    <label>New radius</label>
    <div class="game-row">
      <input id="game-radius-val" type="number" step="any" value="1" min="0.01" />
      <select id="game-radius-unit">
        <option value="miles" selected>miles</option>
        <option value="kilometers">km</option>
      </select>
    </div>
    <button type="button" class="game-btn" id="game-add-radius">+ Add radius</button>
    <button type="button" class="game-btn" id="game-add-thermo">+ Add thermometer</button>
  </div>
  <p class="game-hint" id="game-hint"></p>
  <div id="game-list"></div>
  <button type="button" class="game-btn secondary" id="game-clear-all">Clear all questions</button>
</div>
<script src="config.js"></script>
<script src="game.js"></script>
<script>
if (!window.MAPBOX_TOKEN) {
  document.body.innerHTML = '<p style="padding:2rem;font-family:sans-serif">Missing <code>config.js</code>. Copy <code>config.example.js</code> and add your Mapbox token.</p>';
  throw new Error('MAPBOX_TOKEN missing');
}
mapboxgl.accessToken = window.MAPBOX_TOKEN;

const STYLES = { light: 'mapbox://styles/mapbox/light-v11', dark: 'mapbox://styles/mapbox/dark-v11' };
let theme = 'light';

const GROUPS = [
  { key:'subway',   label:'Subway',        sw:'#EE352E',
    line:{ file:'data/subway_lines.geojson',     width:2.0, casing:1.6, dash:null },
    stop:{ file:'data/subway_stations.geojson',  r:1.8, label:false } },
  { key:'mnr',      label:'Metro-North',   sw:'#0039A6',
    line:{ file:'data/mnr_lines_play.geojson',   width:3.2, casing:2.2, dash:null },
    stop:{ file:'data/mnr_stations_play.geojson',r:3.0, label:false } },
  { key:'lirr',     label:'LIRR',          sw:'#C60C30',
    line:{ file:'data/lirr_lines_play.geojson',  width:3.2, casing:2.2, dash:null },
    stop:{ file:'data/lirr_stations_play.geojson',r:3.0, label:false } },
  { key:'airtrain', label:'AirTrain (JFK)',sw:'#00857C',
    line:{ file:'data/airtrain_lines.geojson',   width:2.8, casing:2.0, dash:null },
    stop:{ file:'data/airtrain_stations.geojson',r:3.0, label:false } },
  { key:'ferry',    label:'Ferries',       sw:'#00839C',
    line:{ file:'data/ferry_routes.geojson',     width:1.4, casing:0,  dash:[2,1.4] },
    stop:{ file:'data/ferry_landings.geojson',   r:2.0, label:false } },
];

const visible = Object.fromEntries(GROUPS.map(g => [g.key, true]));
let showBoroughs = true;
let showZones = false;

function ferryIconDataUrl(colors) {
  const cols = (colors || '#0066ff').split(',').filter(Boolean).slice(0, 6);
  const n = cols.length;
  const s = 14, c = document.createElement('canvas');
  c.width = s; c.height = s;
  const ctx = c.getContext('2d');
  const pad = 1, w = s - pad * 2;
  if (n === 1) {
    ctx.fillStyle = cols[0]; ctx.fillRect(pad, pad, w, w);
  } else if (n === 2) {
    ctx.fillStyle = cols[0]; ctx.fillRect(pad, pad, w / 2, w);
    ctx.fillStyle = cols[1]; ctx.fillRect(pad + w / 2, pad, w / 2, w);
  } else {
    const cx = s / 2, cy = s / 2, r = w / 2;
    for (let i = 0; i < n; i++) {
      const a0 = Math.PI * 2 * i / n - Math.PI / 2;
      const a1 = Math.PI * 2 * (i + 1) / n - Math.PI / 2;
      ctx.beginPath(); ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, a0, a1); ctx.closePath();
      ctx.fillStyle = cols[i]; ctx.fill();
    }
  }
  ctx.strokeStyle = theme === 'dark' ? '#e8eaed' : '#1a1a1a';
  ctx.lineWidth = 0.8; ctx.strokeRect(pad + 0.5, pad + 0.5, w - 1, w - 1);
  return c.toDataURL();
}

const map = new mapboxgl.Map({
  container:'map', style:STYLES[theme],
  center:[-73.92,40.70], zoom:9.3, hash:true, attributionControl:true
});
map.addControl(new mapboxgl.NavigationControl({visualizePitch:false}), 'top-right');
map.addControl(new mapboxgl.GeolocateControl({positionOptions:{enableHighAccuracy:true},trackUserLocation:true}), 'top-right');

async function addLayers() {
  const casing = theme === 'dark' ? '#0b0e13' : '#ffffff';
  const labelColor = theme === 'dark' ? '#f3f4f6' : '#1f1f1f';
  const labelHalo  = theme === 'dark' ? '#0b0e13' : '#fffef8';
  const boroFill   = theme === 'dark' ? '#1e3a5f' : '#dbeafe';
  const boroLine   = theme === 'dark' ? '#9098a4' : '#666666';
  const TOP = GROUPS[0].key + '-casing';

  map.addSource('boroughs', { type:'geojson', data:'data/nyc_boroughs.geojson' });
  map.addSource('borough-labels', { type:'geojson', data:'data/borough_labels.geojson' });
  map.addLayer({
    id:'boroughs-fill', type:'fill', source:'boroughs',
    layout:{ visibility: showBoroughs ? 'visible' : 'none' },
    paint:{ 'fill-color': boroFill, 'fill-opacity': 0.06 }
  }, TOP);
  map.addLayer({
    id:'boroughs-line', type:'line', source:'boroughs',
    layout:{ visibility: showBoroughs ? 'visible' : 'none' },
    paint:{ 'line-color': boroLine, 'line-opacity': 0.45,
      'line-width': ['interpolate',['linear'],['zoom'], 8, 0.8, 12, 1.6] }
  }, TOP);

  fetch('data/hide_zones_meta.json').then(r => r.json()).then(meta => {
    map.addSource('hide-zones', {
      type:'image', url:'data/hide_zones.png',
      coordinates:[[meta.lon0, meta.lat1], [meta.lon1, meta.lat1],
                   [meta.lon1, meta.lat0], [meta.lon0, meta.lat0]]
    });
    map.addLayer({
      id:'hide-zones', type:'raster', source:'hide-zones',
      layout:{ visibility: showZones ? 'visible' : 'none' },
      paint:{ 'raster-opacity': theme === 'dark' ? 0.48 : 0.42 }
    }, TOP);
  });

  for (const g of GROUPS) {
    map.addSource(g.key+'-line', { type:'geojson', data:g.line.file });
    if (g.line.casing > 0) {
      map.addLayer({
        id:g.key+'-casing', type:'line', source:g.key+'-line',
        layout:{ 'line-cap':'round','line-join':'round', visibility:visible[g.key]?'visible':'none' },
        paint:{ 'line-color':casing,
          'line-width':['interpolate',['linear'],['zoom'], 8, g.line.width*0.6+g.line.casing, 14, (g.line.width+g.line.casing)*2.2] }
      });
    }
    map.addLayer({
      id:g.key+'-line-l', type:'line', source:g.key+'-line',
      layout:{ 'line-cap':'round','line-join':'round', visibility:visible[g.key]?'visible':'none' },
      paint:Object.assign({
        'line-color':['coalesce',['get','color'], g.sw],
        'line-width':['interpolate',['linear'],['zoom'], 8, g.line.width*0.55, 14, g.line.width*2.0]
      }, g.line.dash ? {'line-dasharray':g.line.dash} : {})
    });

    if (g.key === 'ferry') {
      const raw = await (await fetch(g.stop.file)).json();
      const iconIds = new Set();
      for (const f of raw.features) {
        const cols = f.properties.colors || g.sw;
        const id = 'ferry-' + cols.replace(/#/g,'').replace(/,/g,'-');
        f.properties.icon = id;
        if (!iconIds.has(id)) {
          iconIds.add(id);
          const img = await new Promise(res => {
            const i = new Image();
            i.onload = () => res(i);
            i.src = ferryIconDataUrl(cols);
          });
          if (!map.hasImage(id)) map.addImage(id, img, { sdf: false });
        }
      }
      map.addSource(g.key+'-stop', { type:'geojson', data: raw });
      map.addLayer({
        id:g.key+'-stop-s', type:'symbol', source:g.key+'-stop',
        layout:{
          visibility:visible[g.key]?'visible':'none',
          'icon-image':['get','icon'],
          'icon-size':['interpolate',['linear'],['zoom'], 8, 0.28, 11, 0.38, 14, 0.48],
          'icon-allow-overlap':true, 'icon-ignore-placement':true
        }
      });
      map.on('click', g.key+'-stop-s', e => {
        new mapboxgl.Popup({offset:8}).setLngLat(e.lngLat)
          .setHTML(`<div>${e.features[0].properties.name||''}</div>`).addTo(map);
      });
      map.on('mouseenter', g.key+'-stop-s', () => map.getCanvas().style.cursor='pointer');
      map.on('mouseleave', g.key+'-stop-s', () => map.getCanvas().style.cursor='');
    } else {
      map.addSource(g.key+'-stop', { type:'geojson', data:g.stop.file });
      map.addLayer({
        id:g.key+'-stop-c', type:'circle', source:g.key+'-stop',
        layout:{ visibility:visible[g.key]?'visible':'none' },
        paint:{
          'circle-radius':['interpolate',['linear'],['zoom'], 9, g.stop.r*0.45, 14, g.stop.r*1.2],
          'circle-color': theme==='dark' ? '#0d1117' : '#fffef8',
          'circle-stroke-color': g.key==='airtrain' ? '#00857C' : (theme==='dark'?'#e8eaed':'#1a1a1a'),
          'circle-stroke-width':1.0
        }
      });
      map.on('click', g.key+'-stop-c', e => {
        new mapboxgl.Popup({offset:8}).setLngLat(e.lngLat)
          .setHTML(`<div>${e.features[0].properties.name||''}</div>`).addTo(map);
      });
      map.on('mouseenter', g.key+'-stop-c', () => map.getCanvas().style.cursor='pointer');
      map.on('mouseleave', g.key+'-stop-c', () => map.getCanvas().style.cursor='');
    }
  }

  map.addLayer({
    id:'boroughs-label', type:'symbol', source:'borough-labels', minzoom:8,
    layout:{
      visibility: showBoroughs ? 'visible' : 'none',
      'text-field': ['get','BoroName'],
      'text-size': ['interpolate',['linear'],['zoom'], 9, 14, 12, 18],
      'text-font': ['DIN Pro Bold','Arial Unicode MS Bold'],
      'text-allow-overlap': true, 'text-ignore-placement': true
    },
    paint:{ 'text-color': labelColor, 'text-halo-color': labelHalo, 'text-halo-width': 2.2 }
  });

  JetLagGame.installMapLayers(map);
  JetLagGame.renderList();
}

function setGroupVisible(key, on) {
  visible[key] = on;
  const v = on ? 'visible' : 'none';
  const suf = key === 'ferry' ? ['-stop-s'] : ['-stop-c'];
  ['-casing','-line-l', ...suf, '-stop-t'].forEach(s => {
    if (map.getLayer(key+s)) map.setLayoutProperty(key+s, 'visibility', v);
  });
}

map.on('style.load', addLayers);
JetLagGame.bindUI();

const toggles = document.getElementById('toggles');
for (const g of GROUPS) {
  const row = document.createElement('label'); row.className='row';
  row.innerHTML = `<input type="checkbox" checked><span class="sw" style="background:${g.sw}"></span>${g.label}`;
  row.querySelector('input').addEventListener('change', e => setGroupVisible(g.key, e.target.checked));
  toggles.appendChild(row);
}
const hr = document.createElement('hr'); toggles.appendChild(hr);
for (const [key, label, sw] of [
  ['boroughs', 'NYC borough borders', '#888'],
  ['zones', '0.375 mi hide zones (union)', '#ffb020']
]) {
  const row = document.createElement('label'); row.className='row';
  const checked = key === 'boroughs';
  row.innerHTML = `<input type="checkbox"${checked?' checked':''}><span class="sw" style="background:${sw};height:10px;border-radius:3px"></span>${label}`;
  row.querySelector('input').addEventListener('change', e => {
    if (key === 'boroughs') {
      showBoroughs = e.target.checked;
      ['boroughs-fill','boroughs-line','boroughs-label'].forEach(id => {
        if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', showBoroughs ? 'visible' : 'none');
      });
    } else {
      showZones = e.target.checked;
      if (map.getLayer('hide-zones')) map.setLayoutProperty('hide-zones', 'visibility', showZones ? 'visible' : 'none');
    }
  });
  toggles.appendChild(row);
}
document.getElementById('theme').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  theme = b.dataset.style;
  document.querySelectorAll('#theme button').forEach(x => x.classList.toggle('active', x===b));
  document.body.classList.toggle('dark', theme==='dark');
  map.setStyle(STYLES[theme]);
});
</script>
</body>
</html>
